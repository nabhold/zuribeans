gaps:
  - "Shared has not published a canonical commerce Store API package."
  - "Trade has not published company accounts, quotations, saved lists or approval-flow contracts (ADR-0017 describes the intended model; no API/schema is published yet)."
  - "Control Plane (`nabhold/baobab-cp`) has only a stub `estate.digital_estate` table (tenant_id, name, domain, status); it does not yet model business_model, markets or capability bindings for a Digital Estate (see docs/reconciliation/canonical-contract-matrix.md, row DigitalEstate, action P3: confirm scope with an ADR first)."
  - "Control Plane's `market.market` table exists but is unimplemented (no Go type, no API); Zuribeans' zuribeans_ug/zuribeans_za market keys (src/lib/market/markets.ts) are candidates mirroring Trade's own bootstrap config, not yet registered, canonical Market records."
notes:
  - "Resolved: shared's ADR-0001 now classifies Zuribeans as B2B/Next.js (contracts/legal-entity/registry.yaml `ZURIBEANS.business_model: B2B`, `digital_estate.status: active`); the organisational mismatch this repo previously recorded no longer exists upstream."
