schema:
  name: "nabhold-development-environment-contract"
  version: "1.0"
application:
  name: "zuribeans"
  version: "0.1.0"
  entity_id: "ZURIBEANS"
environment:
  provider: "baobab-dev"
  profile: "frontend"
  minimum_version: null
  contract_minimum_version: "1.0"
compatibility_policy:
  strict_runtime_versions: true
  allow_newer_patch_versions: true
  allow_newer_minor_versions: false
  allow_older_versions: false
validation:
  required_capabilities:
    - "languages.node"
    - "package_managers.pnpm"
    - "development.github_cli"
    - "frontend_tooling.turbo"
  excluded_capabilities:
    - { name: "python", reason: "Frontend repository builds no Python code." }
    - { name: "flutter", reason: "Frontend repository builds no Flutter code." }
    - { name: "postgresql", reason: "The estate accesses no database directly." }
    - { name: "docker", reason: "Not required for ordinary Codespaces development." }
  pending_capabilities: []
notes:
  - "minimum_version remains null until baobab-dev publishes a frontend image."
  - "The temporary Dev Container is recorded in ADR 0003 and must be retired after that publication."
