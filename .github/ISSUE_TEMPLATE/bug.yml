name: Bug report
description: Report a reproducible Zuribeans defect.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what was expected?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable reproduction.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Codespaces, local Dev Container, preview, or production
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Include sanitized logs or screenshots; never include credentials or customer data.
