name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Quality gates
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/nabhold/baobab-dev:1.2.6-frontend-e2e
      options: --user 0
    env:
      PLAYWRIGHT_BROWSERS_PATH: /root/.cache/ms-playwright
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        env:
          MEDUSA_BACKEND_URL: http://localhost:9000
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_build_only
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_MARKET: za
        run: pnpm build
      - name: End-to-end tests
        env:
          CI: "true"
          MEDUSA_BACKEND_URL: http://localhost:9000
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_e2e_only
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_MARKET: za
        run: pnpm test:e2e
      - name: Validate architecture declarations
        run: test -f contracts.lock.yaml && test -f runtime/requirements.yaml && test -f .nabhold/environment.yaml

  image:
    name: Build deployable image
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: >-
          docker build
          --build-arg MEDUSA_BACKEND_URL=http://localhost:9000
          --build-arg NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=pk_ci_build_only
          --build-arg NEXT_PUBLIC_SITE_URL=http://localhost:3000
          --build-arg NEXT_PUBLIC_MARKET=za
          --tag zuribeans:test .
