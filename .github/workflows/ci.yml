name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build
        env:
          MEDUSA_BACKEND_URL: http://localhost:9000
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_build_only
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_MARKET: za
        run: pnpm build
      - name: Build deployable image
        run: >-
          docker build
          --build-arg MEDUSA_BACKEND_URL=http://localhost:9000
          --build-arg NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=pk_ci_build_only
          --build-arg NEXT_PUBLIC_SITE_URL=http://localhost:3000
          --build-arg NEXT_PUBLIC_MARKET=za
          --tag zuribeans:test .
      - name: Validate architecture declarations
        run: test -f contracts.lock.yaml && test -f runtime/requirements.yaml && test -f .nabhold/environment.yaml
